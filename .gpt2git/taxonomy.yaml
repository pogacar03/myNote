version: 2

root: knowledge

# Taxonomy only decides the broad directory.
# One Markdown file = one learning/interview question.
# The filename must be the question itself (or a stable cleaned-up question),
# never an aggregate topic filename such as mysql.md / spring.md / agent.md.

routes:
  java:
    domain: languages

  spring:
    domain: frameworks

  mysql:
    domain: database

  sqlite:
    domain: database

  redis:
    domain: cache

  kafka:
    domain: messaging

  rag:
    domain: ai

  agent:
    domain: ai

  langgraph:
    domain: ai

  agentscope:
    domain: ai

file_policy:
  mode: one-question-per-file
  filename: question
  merge_key: semantic-question
